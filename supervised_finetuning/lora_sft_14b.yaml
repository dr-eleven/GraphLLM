### GraphSSR role
# LoRA SFT for the local Qwen2.5-14B-Instruct checkpoint on three 24 GiB GPUs.
# Keep complete GraphSSR trajectories and use a near-paper global batch size.

### model
model_name_or_path: /opt/data/private/Graph-R1-main/locals/Qwen/Qwen2.5-14B-Instruct
trust_remote_code: false
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

# ZeRO-3 CPU parameter/optimizer offload is required for 14B long-sequence SFT
# on 24 GiB GPUs. The local no-pin config avoids consuming excessive pinned RAM.
deepspeed: /opt/data/private/GraphSSR-master/supervised_finetuning/ds_z3_offload_no_pin_config.json

### dataset
# Use a dedicated complete-sequence filtered dataset for the 14B memory budget.
dataset: graph_data_lora_sft_14b_filtered
dataset_dir: /opt/data/private/GraphSSR-master/supervised_finetuning
template: qwen
# Count the complete prompt + response trajectory, including template tokens
# and EOS. The launcher drops longer examples rather than training on truncated
# XML responses. 10240 OOMs during the first backward pass on three 24 GiB
# GPUs, while 8192 leaves enough headroom for checkpointed activations.
cutoff_len: 8192
max_samples: null
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
dataloader_pin_memory: false

### output
output_dir: /opt/data/private/GraphSSR-master/outputs/sft/qwen2.5_14b_lora
save_steps: 100
save_total_limit: 2
logging_steps: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
# Global batch = 1 sample/GPU * 3 GPUs * 21 accumulation steps = 63,
# closely matching the paper's total batch size of 64.
gradient_accumulation_steps: 21

# Stay close to the paper's 1e-5 full-SFT rate. A lower LoRA LR is preferable
# for the 14B model and long reasoning targets than the 3B setting of 5e-5.
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
use_reentrant_gc: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
# No held-out SFT split is supplied by GraphSSR.  Evaluate the merged SFT model
# on the SSR validation set before starting RL.
