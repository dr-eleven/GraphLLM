### GraphSSR role
# This configuration defines the supervised fine-tuning stage over `graph_sft_data.json`.
# It is consumed by LlamaFactory after the SFT data generation pipeline finishes.

### model
model_name_or_path: /opt/data/private/Graph-R1-main/locals/DeepSeek-R1-Distill-Qwen-1.5B
trust_remote_code: false

### method
stage: sft
do_train: true
finetuning_type: lora

# 建议从这组参数开始
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

# 长序列仍然很占显存，保留 ZeRO-3。
deepspeed: /opt/data/private/Graph-R1-main/code/LLaMA-Factory/examples/deepspeed/ds_z3_offload_config.json

### dataset
dataset: graph_data_lora_sft_1_5b_filtered
dataset_dir: /opt/data/private/GraphSSR-master/supervised_finetuning
template: deepseekr1
# The launch script drops complete formatted samples above this limit before
# LLaMA-Factory preprocessing, so response suffixes are never used as targets.
cutoff_len: 10240
max_samples: null
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: /opt/data/private/GraphSSR-master/outputs/sft/ds1.5b_lora
save_steps: 100
save_total_limit: 2
logging_steps: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2

# LoRA 通常使用比全参数训练更大的学习率
learning_rate: 1.0e-4

num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

# 第一次训练不要继承原来的全参数 checkpoint
resume_from_checkpoint: null
